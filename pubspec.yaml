name: paper_gen
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0
  provider: ^6.1.2
  pdf: ^3.11.3
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_auth: ^5.5.2
  firebase_core: ^3.15.2
  modal_progress_hud_nsn: ^0.5.1
  flutter_math_fork: ^0.7.4
  email_otp: ^3.0.2
  email_validator: ^3.0.0
  cloud_firestore: ^5.6.12
  multiavatar: ^0.1.5
  flutter_svg: ^2.2.2
  intl: ^0.20.2
  firebase_ai: ^2.3.0
  http: ^1.6.0
  youtube_player_flutter: ^9.1.3
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: Copper
      fonts:
        - asset: fonts/Copperplate.otf
    - family: Funnel
      fonts:
        - asset: fonts/FunnelDisplay-VariableFont_wght.ttf
